<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>AI Voice Input Recorder</title>
  </head>
  <body>
    <script>
      const { ipcRenderer } = require("electron");

      let stream = null;
      let audioContext = null;
      let source = null;
      let processor = null;
      let chunks = [];
      let preparing = false;

      ipcRenderer.on("recorder:prepare", async () => {
        try {
          await prepareRecorder();
        } catch (error) {
          ipcRenderer.send("recorder:error", error?.message || String(error));
        }
      });

      ipcRenderer.on("recorder:start", async () => {
        try {
          if (processor) return;
          chunks = [];
          await prepareRecorder();
          await audioContext.resume();
          processor = audioContext.createScriptProcessor(4096, 1, 1);
          processor.onaudioprocess = (event) => {
            chunks.push(new Float32Array(event.inputBuffer.getChannelData(0)));
          };
          source.connect(processor);
          processor.connect(audioContext.destination);
          ipcRenderer.send("recorder:started");
        } catch (error) {
          ipcRenderer.send("recorder:error", error?.message || String(error));
        }
      });

      ipcRenderer.on("recorder:stop", () => {
        stopRecording();
      });

      ipcRenderer.on("recorder:reset", async () => {
        await resetRecorder();
      });

      async function prepareRecorder() {
        if (preparing) return;
        if (stream && !isStreamLive(stream)) {
          await resetRecorder();
        }
        if (audioContext?.state === "closed") {
          await resetRecorder();
        }
        if (stream && audioContext && source) return;
        preparing = true;
        try {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            throw new Error("当前录音页面不是安全上下文，无法访问麦克风 API");
          }

          stream = await navigator.mediaDevices.getUserMedia({
            audio: {
              sampleRate: { ideal: 16000 },
              channelCount: { ideal: 1 },
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true
            }
          });

          audioContext = new AudioContext({ sampleRate: 16000 });
          source = audioContext.createMediaStreamSource(stream);
        } finally {
          preparing = false;
        }
      }

      function isStreamLive(currentStream) {
        const tracks = currentStream.getAudioTracks();
        return currentStream.active && tracks.length > 0 && tracks.every((track) => track.readyState === "live" && track.enabled);
      }

      async function stopRecording() {
        if (!audioContext || !processor) return;
        const sampleRate = audioContext.sampleRate;
        processor?.disconnect();
        source?.disconnect();
        await new Promise((r) => setTimeout(r, 300));
        const wav = encodeWav(chunks, sampleRate);
        processor = null;
        ipcRenderer.send("recorder:stopped", {
          bytes: Array.from(new Uint8Array(wav)),
          mimeType: "audio/wav"
        });
      }

      async function resetRecorder() {
        try {
          processor?.disconnect();
          source?.disconnect();
        } catch {}
        processor = null;
        source = null;
        chunks = [];
        stream?.getTracks().forEach((track) => track.stop());
        stream = null;
        if (audioContext && audioContext.state !== "closed") {
          await audioContext.close();
        }
        audioContext = null;
      }

      window.addEventListener("beforeunload", () => {
        stream?.getTracks().forEach((track) => track.stop());
      });

      function encodeWav(buffers, sampleRate) {
        const length = buffers.reduce((sum, buffer) => sum + buffer.length, 0);
        const dataLength = length * 2;
        const buffer = new ArrayBuffer(44 + dataLength);
        const view = new DataView(buffer);
        writeString(view, 0, "RIFF");
        view.setUint32(4, 36 + dataLength, true);
        writeString(view, 8, "WAVE");
        writeString(view, 12, "fmt ");
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        writeString(view, 36, "data");
        view.setUint32(40, dataLength, true);
        let offset = 44;
        for (const input of buffers) {
          for (let i = 0; i < input.length; i += 1) {
            const sample = Math.max(-1, Math.min(1, input[i]));
            view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7fff, true);
            offset += 2;
          }
        }
        return buffer;
      }

      function writeString(view, offset, string) {
        for (let i = 0; i < string.length; i += 1) {
          view.setUint8(offset + i, string.charCodeAt(i));
        }
      }
    </script>
  </body>
</html>
